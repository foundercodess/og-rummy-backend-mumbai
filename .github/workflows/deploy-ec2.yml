name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug SSH config
        run: |
          echo "USER:"
          echo "${{ secrets.EC2_USER }}"

          echo "HOST:"
          echo "${{ secrets.EC2_HOST }}"

          echo "KEY LENGTH:"
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" | wc -c

      - name: Copy application to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "."
          target: "/home/${{ secrets.EC2_USER }}/og-rummy-backend"
          rm: false
          overwrite: true
          strip_components: 0

      - name: Deploy application on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Existing env vars
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_BASE_URL: ${{ secrets.AWS_S3_BASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          PORT: ${{ secrets.PORT }}
          NODE_ENV: production
          POOL_SPLIT_ENABLED: "true"
          BOT_ENGINE_ENABLED: "true"
          ENABLE_BOT_SOFT_RIGGING: "true"
          BOT_INJECT_AFTER_SECONDS: "7"
          BOT_SCAN_EVERY_MS: "5000"
          BOT_SCAN_BATCH_LIMIT: "25"
          BOT_POOL_SIZE: "50"
          BOT_AUTO_READY: "true"
          BOT_NAME_PREFIX: "RummyBot-"
          BOT_PHONE_PREFIX: "98999"
          BOT_SESSION_LOCK_TTL_SECONDS: "20"
          BOT_ACTION_DELAY_MIN_MS: "1200"
          BOT_ACTION_DELAY_MAX_MS: "3200"
          BOT_ACTION_DELAY_MS: "0"
          BOT_POST_PICK_DELAY_MIN_MS: "600"
          BOT_POST_PICK_DELAY_MAX_MS: "1400"
          BOT_POST_PICK_DELAY_MS: "0"
          BOT_DECLARE_RESPONSE_DELAY_MS: "800"
          BOT_AGGRESSION_ENABLED: "true"
          BOT_STRATEGIC_DROP_ENABLED: "true"
          BOT_DROP_BENEFIT_THRESHOLD: "20"
          BOT_EARLY_DROP_DEAD_HAND_ENABLED: "true"
          BOT_HOPELESS_DISPLAY_POINT: "45"
          BOT_HOPELESS_TURN_MIN: "4"
          BOT_POOL_COMFORTABLE_HEADROOM: "45"
          BOT_POOL_NEAR_ELIMINATION_HEADROOM: "28"
          BOT_POOL_HIGH_SCORE_DROP_AT: "50"
          BOT_SPLIT_AUTO_RESPONSE_MIN_MS: "600"
          BOT_SPLIT_AUTO_RESPONSE_MAX_MS: "1500"
          BOT_SPLIT_MIN_GAIN_MULTIPLIER: "0.6"
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          # envs: DATABASE_URL,JWT_SECRET,AWS_REGION,AWS_S3_BUCKET,AWS_S3_BASE_URL,REDIS_URL,KAFKA_BROKERS,JWT_EXPIRES_IN,PORT,NODE_ENV,BOT_ENGINE_ENABLED,BOT_INJECT_AFTER_SECONDS,BOT_SCAN_EVERY_MS,BOT_SCAN_BATCH_LIMIT,BOT_POOL_SIZE,BOT_AUTO_READY,BOT_NAME_PREFIX,BOT_PHONE_PREFIX,BOT_SESSION_LOCK_TTL_SECONDS,BOT_ACTION_DELAY_MIN_MS,BOT_ACTION_DELAY_MAX_MS,BOT_ACTION_DELAY_MS,BOT_DECLARE_RESPONSE_DELAY_MS
          envs: DATABASE_URL,JWT_SECRET,AWS_REGION,AWS_S3_BUCKET,AWS_S3_BASE_URL,REDIS_URL,KAFKA_BROKERS,JWT_EXPIRES_IN,PORT,NODE_ENV,POOL_SPLIT_ENABLED,BOT_ENGINE_ENABLED,ENABLE_BOT_SOFT_RIGGING,BOT_INJECT_AFTER_SECONDS,BOT_SCAN_EVERY_MS,BOT_SCAN_BATCH_LIMIT,BOT_POOL_SIZE,BOT_AUTO_READY,BOT_NAME_PREFIX,BOT_PHONE_PREFIX,BOT_SESSION_LOCK_TTL_SECONDS,BOT_ACTION_DELAY_MIN_MS,BOT_ACTION_DELAY_MAX_MS,BOT_ACTION_DELAY_MS,BOT_POST_PICK_DELAY_MIN_MS,BOT_POST_PICK_DELAY_MAX_MS,BOT_POST_PICK_DELAY_MS,BOT_DECLARE_RESPONSE_DELAY_MS,BOT_AGGRESSION_ENABLED,BOT_STRATEGIC_DROP_ENABLED,BOT_DROP_BENEFIT_THRESHOLD,BOT_EARLY_DROP_DEAD_HAND_ENABLED,BOT_HOPELESS_DISPLAY_POINT,BOT_HOPELESS_TURN_MIN,BOT_POOL_COMFORTABLE_HEADROOM,BOT_POOL_NEAR_ELIMINATION_HEADROOM,BOT_POOL_HIGH_SCORE_DROP_AT,BOT_SPLIT_AUTO_RESPONSE_MIN_MS,BOT_SPLIT_AUTO_RESPONSE_MAX_MS,BOT_SPLIT_MIN_GAIN_MULTIPLIER
          script: |
            set -eu
            APP_DIR=/home/${{ secrets.EC2_USER }}/og-rummy-backend
            chmod +x "$APP_DIR/scripts/deploy-ec2.sh"
            APP_DIR="$APP_DIR" \
            PORT="${PORT:-3000}" \
            NODE_ENV="$NODE_ENV" \
            KAFKA_BROKERS="${KAFKA_BROKERS:-localhost:9092}" \
            DATABASE_URL="$DATABASE_URL" \
            JWT_SECRET="$JWT_SECRET" \
            JWT_EXPIRES_IN="${JWT_EXPIRES_IN:-7d}" \
            AWS_REGION="$AWS_REGION" \
            AWS_S3_BUCKET="$AWS_S3_BUCKET" \
            AWS_S3_BASE_URL="$AWS_S3_BASE_URL" \
            REDIS_URL="${REDIS_URL:-}" \
            POOL_SPLIT_ENABLED="$POOL_SPLIT_ENABLED" \
            BOT_ENGINE_ENABLED="$BOT_ENGINE_ENABLED" \
            ENABLE_BOT_SOFT_RIGGING="$ENABLE_BOT_SOFT_RIGGING" \
            BOT_INJECT_AFTER_SECONDS="$BOT_INJECT_AFTER_SECONDS" \
            BOT_SCAN_EVERY_MS="$BOT_SCAN_EVERY_MS" \
            BOT_SCAN_BATCH_LIMIT="$BOT_SCAN_BATCH_LIMIT" \
            BOT_POOL_SIZE="$BOT_POOL_SIZE" \
            BOT_AUTO_READY="$BOT_AUTO_READY" \
            BOT_NAME_PREFIX="$BOT_NAME_PREFIX" \
            BOT_PHONE_PREFIX="$BOT_PHONE_PREFIX" \
            BOT_SESSION_LOCK_TTL_SECONDS="$BOT_SESSION_LOCK_TTL_SECONDS" \
            BOT_ACTION_DELAY_MIN_MS="$BOT_ACTION_DELAY_MIN_MS" \
            BOT_ACTION_DELAY_MAX_MS="$BOT_ACTION_DELAY_MAX_MS" \
            BOT_ACTION_DELAY_MS="$BOT_ACTION_DELAY_MS" \
            BOT_POST_PICK_DELAY_MIN_MS="$BOT_POST_PICK_DELAY_MIN_MS" \
            BOT_POST_PICK_DELAY_MAX_MS="$BOT_POST_PICK_DELAY_MAX_MS" \
            BOT_POST_PICK_DELAY_MS="$BOT_POST_PICK_DELAY_MS" \
            BOT_DECLARE_RESPONSE_DELAY_MS="$BOT_DECLARE_RESPONSE_DELAY_MS" \
            BOT_AGGRESSION_ENABLED="$BOT_AGGRESSION_ENABLED" \
            BOT_STRATEGIC_DROP_ENABLED="$BOT_STRATEGIC_DROP_ENABLED" \
            BOT_DROP_BENEFIT_THRESHOLD="$BOT_DROP_BENEFIT_THRESHOLD" \
            BOT_EARLY_DROP_DEAD_HAND_ENABLED="$BOT_EARLY_DROP_DEAD_HAND_ENABLED" \
            BOT_HOPELESS_DISPLAY_POINT="$BOT_HOPELESS_DISPLAY_POINT" \
            BOT_HOPELESS_TURN_MIN="$BOT_HOPELESS_TURN_MIN" \
            BOT_POOL_COMFORTABLE_HEADROOM="$BOT_POOL_COMFORTABLE_HEADROOM" \
            BOT_POOL_NEAR_ELIMINATION_HEADROOM="$BOT_POOL_NEAR_ELIMINATION_HEADROOM" \
            BOT_POOL_HIGH_SCORE_DROP_AT="$BOT_POOL_HIGH_SCORE_DROP_AT" \
            BOT_SPLIT_AUTO_RESPONSE_MIN_MS="$BOT_SPLIT_AUTO_RESPONSE_MIN_MS" \
            BOT_SPLIT_AUTO_RESPONSE_MAX_MS="$BOT_SPLIT_AUTO_RESPONSE_MAX_MS" \
            BOT_SPLIT_MIN_GAIN_MULTIPLIER="$BOT_SPLIT_MIN_GAIN_MULTIPLIER" \
            sh "$APP_DIR/scripts/deploy-ec2.sh"