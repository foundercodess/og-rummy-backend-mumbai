name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Rolling: finish node 1 (health OK) before node 2 so ALB keeps one target up.
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        node: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target host
        id: target
        env:
          HOST_1: ${{ secrets.EC2_HOST_1 }}
          HOST_LEGACY: ${{ secrets.EC2_HOST }}
          HOST_2: ${{ secrets.EC2_HOST_2 }}
        run: |
          set -eu
          trim() { printf '%s' "$1" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          if [ "${{ matrix.node }}" = "1" ]; then
            H="$(trim "${HOST_1:-$HOST_LEGACY}")"
            if [ -z "$H" ]; then
              echo "Missing EC2_HOST_1 (or legacy EC2_HOST)"
              exit 1
            fi
            echo "host=$H" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Deploying node 1 -> $H"
          else
            H="$(trim "${HOST_2:-}")"
            if [ -z "$H" ]; then
              echo "EC2_HOST_2 not set — skipping second node"
              echo "host=" >> "$GITHUB_OUTPUT"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "host=$H" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "Deploying node 2 -> $H"
            fi
          fi

      - name: Debug SSH config
        if: steps.target.outputs.skip != 'true'
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          echo "NODE: ${{ matrix.node }}"
          echo "USER: ${{ secrets.EC2_USER }}"
          echo "HOST: ${{ steps.target.outputs.host }}"
          echo "KEY LENGTH: $(printf '%s' "$SSH_KEY" | wc -c)"
          # Fingerprint only (never print private key)
          KEY_FILE="$(mktemp)"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          if ssh-keygen -y -f "$KEY_FILE" >/tmp/ci_pubkey 2>/tmp/ci_pubkey_err; then
            echo "CI public key fingerprint:"
            ssh-keygen -lf /tmp/ci_pubkey
          else
            echo "WARN: could not derive public key from EC2_SSH_PRIVATE_KEY"
            cat /tmp/ci_pubkey_err || true
          fi
          rm -f "$KEY_FILE" /tmp/ci_pubkey /tmp/ci_pubkey_err

      - name: SSH auth preflight
        if: steps.target.outputs.skip != 'true'
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          KEY_FILE="$(mktemp)"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          HOST="${{ steps.target.outputs.host }}"
          USER="${{ secrets.EC2_USER }}"
          echo "Testing ssh ${USER}@${HOST} ..."
          if ! ssh -i "$KEY_FILE" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            "${USER}@${HOST}" 'echo SSH_OK; hostname; whoami'; then
            echo "::error::SSH auth failed for ${USER}@${HOST}."
            echo "Node 1 OK + node 2 fail usually means:"
            echo "  1) EC2_HOST_2 is wrong / has typo, or"
            echo "  2) EC2_SSH_PRIVATE_KEY in GitHub is NOT the same key allowed on node 2."
            echo "Fix: paste full contents of og-rummy-mumbai.pem into EC2_SSH_PRIVATE_KEY,"
            echo "     and ensure both instances have that public key in ~/.ssh/authorized_keys."
            rm -f "$KEY_FILE"
            exit 1
          fi
          rm -f "$KEY_FILE"

      - name: Copy application to EC2
        if: steps.target.outputs.skip != 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.target.outputs.host }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "."
          target: "/home/${{ secrets.EC2_USER }}/og-rummy-backend"
          rm: false
          overwrite: true
          strip_components: 0

      - name: Deploy application on EC2
        if: steps.target.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_BASE_URL: ${{ secrets.AWS_S3_BASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          PORT: ${{ secrets.PORT }}
          NODE_ENV: production
          POOL_SPLIT_ENABLED: "true"
          BOT_ENGINE_ENABLED: "true"
          ENABLE_BOT_SOFT_RIGGING: "true"
          BOT_INJECT_AFTER_SECONDS: "7"
          BOT_SCAN_EVERY_MS: "5000"
          BOT_SCAN_BATCH_LIMIT: "25"
          BOT_POOL_SIZE: "50"
          BOT_AUTO_READY: "true"
          BOT_NAME_PREFIX: "RummyBot-"
          BOT_PHONE_PREFIX: "98999"
          BOT_SESSION_LOCK_TTL_SECONDS: "20"
          BOT_ACTION_DELAY_MIN_MS: "1200"
          BOT_ACTION_DELAY_MAX_MS: "3200"
          BOT_ACTION_DELAY_MS: "0"
          BOT_POST_PICK_DELAY_MIN_MS: "2000"
          BOT_POST_PICK_DELAY_MAX_MS: "8000"
          BOT_POST_PICK_DELAY_MS: "0"
          BOT_DECLARE_RESPONSE_DELAY_MS: "800"
          BOT_AGGRESSION_ENABLED: "true"
          BOT_STRATEGIC_DROP_ENABLED: "true"
          BOT_DROP_BENEFIT_THRESHOLD: "20"
          BOT_EARLY_DROP_DEAD_HAND_ENABLED: "true"
          BOT_HOPELESS_DISPLAY_POINT: "45"
          BOT_HOPELESS_TURN_MIN: "4"
          BOT_POOL_COMFORTABLE_HEADROOM: "45"
          BOT_POOL_NEAR_ELIMINATION_HEADROOM: "28"
          BOT_POOL_HIGH_SCORE_DROP_AT: "50"
          BOT_SPLIT_AUTO_RESPONSE_MIN_MS: "600"
          BOT_SPLIT_AUTO_RESPONSE_MAX_MS: "1500"
          BOT_SPLIT_MIN_GAIN_MULTIPLIER: "0.6"
          GIFTAURA_PG_API_URL: "https://pgapi.giftaura.shop/paynow"
          GIFTAURA_PAYIN_STATUS_API_URL: "https://pgapi.giftaura.shop/payinstatus"
          GIFTAURA_MERCHANT_ID: "INDIANPAY00GIFTAURA00004"
          GIFTAURA_PG_TYPE: "2"
          GIFTAURA_REMARK: "Add Cash"
          GIFTAURA_REDIRECT_URL: "http://98.93.245.161/api/wallet/payment-callback"
          RECHARGE_PAYIN_SYNC_ENABLED: "true"
          RECHARGE_PAYIN_SYNC_CRON: "*/10 * * * *"
          RECHARGE_PAYIN_SYNC_MIN_AGE_MINUTES: "2"
          RECHARGE_PAYIN_SYNC_BATCH_LIMIT: "50"
          SESSION_STATE_CACHE_ENABLED: "true"
          SESSION_STATE_CACHE_TTL_MS: "30000"
          # Phase 3 permanent: Redis live state + async PG snapshot (set false only to roll back)
          LIVE_SESSION_STATE_ENABLED: "true"
          LIVE_SESSION_STATE_ASYNC_PG: "true"
          LIVE_SESSION_STATE_TTL_MS: "21600000"
          LIVE_SESSION_ASYNC_PG_CONCURRENCY: "2"
          # Bot finish-eval hard budgets (event-loop protection)
          BOT_FINISH_EVAL_BUDGET_MS: "40"
          BOT_FINISH_EVAL_MAX_CARDS: "5"
          GROUPING_FINISH_SCAN_BUDGET_MS: "20"
          GROUPING_WORKER_ENABLED: "true"
          GROUPING_WORKER_COUNT: "2"
          PICK_ACK_FINISH_PLAN_MAX_CANDIDATES: "0"
          DB_POOL_SPLIT: "true"
          DB_POOL_MAX: "20"
          DB_POOL_MAX_GAMEPLAY: "16"
          DB_POOL_MAX_AUTH: "6"
          MAX_SOCKETS_PER_WORKER: "500"
          ADMIT_MAX_EVENT_LOOP_LAG_MS: "120"
          DB_STATEMENT_TIMEOUT: "10000"
          DB_IDLE_IN_TX_TIMEOUT: "30000"
          GIFTAURA_MERCHANT_TOKEN: ${{ secrets.GIFTAURA_MERCHANT_TOKEN }}
          GIFTAURA_PAYOUT_API_URL: ${{ secrets.GIFTAURA_PAYOUT_API_URL }}
          GIFTAURA_PAYOUT_REMARK: ${{ secrets.GIFTAURA_PAYOUT_REMARK }}
          GIFTAURA_PAYOUT_HISTORY_API_URL: ${{ secrets.GIFTAURA_PAYOUT_HISTORY_API_URL }}
          WITHDRAWAL_PAYOUT_SYNC_ENABLED: ${{ secrets.WITHDRAWAL_PAYOUT_SYNC_ENABLED }}
          WITHDRAWAL_PAYOUT_SYNC_CRON: ${{ secrets.WITHDRAWAL_PAYOUT_SYNC_CRON }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          FCM_ANDROID_CHANNEL_ID: og_rummy_default
        with:
          host: ${{ steps.target.outputs.host }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          envs: DATABASE_URL,JWT_SECRET,AWS_REGION,AWS_S3_BUCKET,AWS_S3_BASE_URL,REDIS_URL,KAFKA_BROKERS,JWT_EXPIRES_IN,PORT,NODE_ENV,POOL_SPLIT_ENABLED,BOT_ENGINE_ENABLED,ENABLE_BOT_SOFT_RIGGING,BOT_INJECT_AFTER_SECONDS,BOT_SCAN_EVERY_MS,BOT_SCAN_BATCH_LIMIT,BOT_POOL_SIZE,BOT_AUTO_READY,BOT_NAME_PREFIX,BOT_PHONE_PREFIX,BOT_SESSION_LOCK_TTL_SECONDS,BOT_ACTION_DELAY_MIN_MS,BOT_ACTION_DELAY_MAX_MS,BOT_ACTION_DELAY_MS,BOT_POST_PICK_DELAY_MIN_MS,BOT_POST_PICK_DELAY_MAX_MS,BOT_POST_PICK_DELAY_MS,BOT_DECLARE_RESPONSE_DELAY_MS,BOT_AGGRESSION_ENABLED,BOT_STRATEGIC_DROP_ENABLED,BOT_DROP_BENEFIT_THRESHOLD,BOT_EARLY_DROP_DEAD_HAND_ENABLED,BOT_HOPELESS_DISPLAY_POINT,BOT_HOPELESS_TURN_MIN,BOT_POOL_COMFORTABLE_HEADROOM,BOT_POOL_NEAR_ELIMINATION_HEADROOM,BOT_POOL_HIGH_SCORE_DROP_AT,BOT_SPLIT_AUTO_RESPONSE_MIN_MS,BOT_SPLIT_AUTO_RESPONSE_MAX_MS,BOT_SPLIT_MIN_GAIN_MULTIPLIER,GIFTAURA_PG_API_URL,GIFTAURA_PAYIN_STATUS_API_URL,GIFTAURA_MERCHANT_ID,GIFTAURA_MERCHANT_TOKEN,GIFTAURA_PG_TYPE,GIFTAURA_REMARK,GIFTAURA_REDIRECT_URL,RECHARGE_PAYIN_SYNC_ENABLED,RECHARGE_PAYIN_SYNC_CRON,RECHARGE_PAYIN_SYNC_MIN_AGE_MINUTES,RECHARGE_PAYIN_SYNC_BATCH_LIMIT,GIFTAURA_PAYOUT_API_URL,GIFTAURA_PAYOUT_REMARK,GIFTAURA_PAYOUT_HISTORY_API_URL,WITHDRAWAL_PAYOUT_SYNC_ENABLED,WITHDRAWAL_PAYOUT_SYNC_CRON,FIREBASE_SERVICE_ACCOUNT_BASE64,FCM_ANDROID_CHANNEL_ID,MATCH_COUNTDOWN_SECONDS,MATCH_COUNTDOWN_LOCK_AT_SECONDS,SESSION_STATE_CACHE_ENABLED,SESSION_STATE_CACHE_TTL_MS,LIVE_SESSION_STATE_ENABLED,LIVE_SESSION_STATE_ASYNC_PG,LIVE_SESSION_STATE_TTL_MS,LIVE_SESSION_ASYNC_PG_CONCURRENCY,BOT_FINISH_EVAL_BUDGET_MS,BOT_FINISH_EVAL_MAX_CARDS,GROUPING_FINISH_SCAN_BUDGET_MS,GROUPING_WORKER_ENABLED,GROUPING_WORKER_COUNT,PICK_ACK_FINISH_PLAN_MAX_CANDIDATES,DB_POOL_SPLIT,DB_POOL_MAX,DB_POOL_MAX_GAMEPLAY,DB_POOL_MAX_AUTH,MAX_SOCKETS_PER_WORKER,ADMIT_MAX_EVENT_LOOP_LAG_MS,DB_STATEMENT_TIMEOUT,DB_IDLE_IN_TX_TIMEOUT
          script: |
            set -eu
            APP_DIR=/home/${{ secrets.EC2_USER }}/og-rummy-backend
            chmod +x "$APP_DIR/scripts/deploy-ec2.sh"
            APP_DIR="$APP_DIR" \
            PORT="${PORT:-3000}" \
            NODE_ENV="$NODE_ENV" \
            KAFKA_BROKERS="${KAFKA_BROKERS:-localhost:9092}" \
            DATABASE_URL="$DATABASE_URL" \
            JWT_SECRET="$JWT_SECRET" \
            JWT_EXPIRES_IN="${JWT_EXPIRES_IN:-7d}" \
            AWS_REGION="$AWS_REGION" \
            AWS_S3_BUCKET="$AWS_S3_BUCKET" \
            AWS_S3_BASE_URL="$AWS_S3_BASE_URL" \
            REDIS_URL="${REDIS_URL:-}" \
            POOL_SPLIT_ENABLED="$POOL_SPLIT_ENABLED" \
            BOT_ENGINE_ENABLED="$BOT_ENGINE_ENABLED" \
            ENABLE_BOT_SOFT_RIGGING="$ENABLE_BOT_SOFT_RIGGING" \
            BOT_INJECT_AFTER_SECONDS="$BOT_INJECT_AFTER_SECONDS" \
            BOT_SCAN_EVERY_MS="$BOT_SCAN_EVERY_MS" \
            BOT_SCAN_BATCH_LIMIT="$BOT_SCAN_BATCH_LIMIT" \
            BOT_POOL_SIZE="$BOT_POOL_SIZE" \
            BOT_AUTO_READY="$BOT_AUTO_READY" \
            BOT_NAME_PREFIX="$BOT_NAME_PREFIX" \
            BOT_PHONE_PREFIX="$BOT_PHONE_PREFIX" \
            BOT_SESSION_LOCK_TTL_SECONDS="$BOT_SESSION_LOCK_TTL_SECONDS" \
            BOT_ACTION_DELAY_MIN_MS="$BOT_ACTION_DELAY_MIN_MS" \
            BOT_ACTION_DELAY_MAX_MS="$BOT_ACTION_DELAY_MAX_MS" \
            BOT_ACTION_DELAY_MS="$BOT_ACTION_DELAY_MS" \
            BOT_POST_PICK_DELAY_MIN_MS="$BOT_POST_PICK_DELAY_MIN_MS" \
            BOT_POST_PICK_DELAY_MAX_MS="$BOT_POST_PICK_DELAY_MAX_MS" \
            BOT_POST_PICK_DELAY_MS="$BOT_POST_PICK_DELAY_MS" \
            BOT_DECLARE_RESPONSE_DELAY_MS="$BOT_DECLARE_RESPONSE_DELAY_MS" \
            BOT_AGGRESSION_ENABLED="$BOT_AGGRESSION_ENABLED" \
            BOT_STRATEGIC_DROP_ENABLED="$BOT_STRATEGIC_DROP_ENABLED" \
            BOT_DROP_BENEFIT_THRESHOLD="$BOT_DROP_BENEFIT_THRESHOLD" \
            BOT_EARLY_DROP_DEAD_HAND_ENABLED="$BOT_EARLY_DROP_DEAD_HAND_ENABLED" \
            BOT_HOPELESS_DISPLAY_POINT="$BOT_HOPELESS_DISPLAY_POINT" \
            BOT_HOPELESS_TURN_MIN="$BOT_HOPELESS_TURN_MIN" \
            BOT_POOL_COMFORTABLE_HEADROOM="$BOT_POOL_COMFORTABLE_HEADROOM" \
            BOT_POOL_NEAR_ELIMINATION_HEADROOM="$BOT_POOL_NEAR_ELIMINATION_HEADROOM" \
            BOT_POOL_HIGH_SCORE_DROP_AT="$BOT_POOL_HIGH_SCORE_DROP_AT" \
            BOT_SPLIT_AUTO_RESPONSE_MIN_MS="$BOT_SPLIT_AUTO_RESPONSE_MIN_MS" \
            BOT_SPLIT_AUTO_RESPONSE_MAX_MS="$BOT_SPLIT_AUTO_RESPONSE_MAX_MS" \
            BOT_SPLIT_MIN_GAIN_MULTIPLIER="$BOT_SPLIT_MIN_GAIN_MULTIPLIER" \
            GIFTAURA_PG_API_URL="${GIFTAURA_PG_API_URL:-https://pgapi.giftaura.shop/paynow}" \
            GIFTAURA_PAYIN_STATUS_API_URL="${GIFTAURA_PAYIN_STATUS_API_URL:-https://pgapi.giftaura.shop/payinstatus}" \
            GIFTAURA_MERCHANT_ID="${GIFTAURA_MERCHANT_ID:-INDIANPAY00GIFTAURA00004}" \
            GIFTAURA_MERCHANT_TOKEN="${GIFTAURA_MERCHANT_TOKEN:-}" \
            GIFTAURA_PG_TYPE="${GIFTAURA_PG_TYPE:-2}" \
            GIFTAURA_REMARK="${GIFTAURA_REMARK:-Add Cash}" \
            GIFTAURA_REDIRECT_URL="${GIFTAURA_REDIRECT_URL:-http://3.108.254.83/api/wallet/payment-callback}" \
            RECHARGE_PAYIN_SYNC_ENABLED="${RECHARGE_PAYIN_SYNC_ENABLED:-true}" \
            RECHARGE_PAYIN_SYNC_CRON="${RECHARGE_PAYIN_SYNC_CRON:-*/10 * * * *}" \
            RECHARGE_PAYIN_SYNC_MIN_AGE_MINUTES="${RECHARGE_PAYIN_SYNC_MIN_AGE_MINUTES:-2}" \
            RECHARGE_PAYIN_SYNC_BATCH_LIMIT="${RECHARGE_PAYIN_SYNC_BATCH_LIMIT:-50}" \
            GIFTAURA_PAYOUT_API_URL="${GIFTAURA_PAYOUT_API_URL:-https://pgapi.giftaura.shop/single_transaction}" \
            GIFTAURA_PAYOUT_REMARK="${GIFTAURA_PAYOUT_REMARK:-Withdrawal}" \
            GIFTAURA_PAYOUT_HISTORY_API_URL="${GIFTAURA_PAYOUT_HISTORY_API_URL:-https://pgapi.giftaura.shop/merchantpayouthistory}" \
            WITHDRAWAL_PAYOUT_SYNC_ENABLED="${WITHDRAWAL_PAYOUT_SYNC_ENABLED:-true}" \
            WITHDRAWAL_PAYOUT_SYNC_CRON="${WITHDRAWAL_PAYOUT_SYNC_CRON:-*/10 * * * *}" \
            FIREBASE_SERVICE_ACCOUNT_BASE64="${FIREBASE_SERVICE_ACCOUNT_BASE64:-}" \
            FCM_ANDROID_CHANNEL_ID="${FCM_ANDROID_CHANNEL_ID:-og_rummy_default}" \
            MATCH_COUNTDOWN_SECONDS="${MATCH_COUNTDOWN_SECONDS:-10}" \
            MATCH_COUNTDOWN_LOCK_AT_SECONDS="${MATCH_COUNTDOWN_LOCK_AT_SECONDS:-3}" \
            SESSION_STATE_CACHE_ENABLED="${SESSION_STATE_CACHE_ENABLED:-true}" \
            SESSION_STATE_CACHE_TTL_MS="${SESSION_STATE_CACHE_TTL_MS:-30000}" \
            LIVE_SESSION_STATE_ENABLED="${LIVE_SESSION_STATE_ENABLED:-true}" \
            LIVE_SESSION_STATE_ASYNC_PG="${LIVE_SESSION_STATE_ASYNC_PG:-true}" \
            LIVE_SESSION_STATE_TTL_MS="${LIVE_SESSION_STATE_TTL_MS:-21600000}" \
            LIVE_SESSION_ASYNC_PG_CONCURRENCY="${LIVE_SESSION_ASYNC_PG_CONCURRENCY:-2}" \
            BOT_FINISH_EVAL_BUDGET_MS="${BOT_FINISH_EVAL_BUDGET_MS:-40}" \
            BOT_FINISH_EVAL_MAX_CARDS="${BOT_FINISH_EVAL_MAX_CARDS:-5}" \
            GROUPING_FINISH_SCAN_BUDGET_MS="${GROUPING_FINISH_SCAN_BUDGET_MS:-20}" \
            GROUPING_WORKER_ENABLED="${GROUPING_WORKER_ENABLED:-true}" \
            GROUPING_WORKER_COUNT="${GROUPING_WORKER_COUNT:-2}" \
            PICK_ACK_FINISH_PLAN_MAX_CANDIDATES="${PICK_ACK_FINISH_PLAN_MAX_CANDIDATES:-0}" \
            DB_POOL_SPLIT="${DB_POOL_SPLIT:-true}" \
            DB_POOL_MAX="${DB_POOL_MAX:-20}" \
            DB_POOL_MAX_GAMEPLAY="${DB_POOL_MAX_GAMEPLAY:-16}" \
            DB_POOL_MAX_AUTH="${DB_POOL_MAX_AUTH:-6}" \
            MAX_SOCKETS_PER_WORKER="${MAX_SOCKETS_PER_WORKER:-500}" \
            ADMIT_MAX_EVENT_LOOP_LAG_MS="${ADMIT_MAX_EVENT_LOOP_LAG_MS:-120}" \
            DB_STATEMENT_TIMEOUT="${DB_STATEMENT_TIMEOUT:-10000}" \
            DB_IDLE_IN_TX_TIMEOUT="${DB_IDLE_IN_TX_TIMEOUT:-30000}" \
            sh "$APP_DIR/scripts/deploy-ec2.sh"
