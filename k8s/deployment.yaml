apiVersion: apps/v1
kind: Deployment
metadata:
  name: og-rummy-api
  namespace: og-rummy
  labels:
    app: og-rummy-api
spec:
  revisionHistoryLimit: 5
  replicas: 2
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: og-rummy-api
  template:
    metadata:
      labels:
        app: og-rummy-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: <ECR_URI>/og-rummy-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: og-rummy-config
            - secretRef:
                name: og-rummy-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
